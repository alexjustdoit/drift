# Pings the Drift Streamlit app every 6 hours to prevent full SCC dormancy.
# Cold starts will still happen between pings — this just prevents the app
# from needing a manual restart after extended inactivity.
#
# TODO: Replace STREAMLIT_URL below with the real SCC URL after deploying.

name: Keepalive

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:        # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://YOUR-APP.streamlit.app \
          | grep -qE '^(200|302)' \
          && echo "OK" \
          || echo "Warning: unexpected status (app may be cold starting)"
